<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 10px; }
        button:hover { background: #e68900; }
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid white; margin-bottom: 15px; cursor: pointer; }
        .back-btn { background: transparent; border: 1px solid white; margin-top: 10px; }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        
        /* Styles for My Blogs section */
        .blog-card { background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
        .action-btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; font-size: 0.8rem; }
        .edit-btn { background-color: #ffc107; color: #000; }
        .delete-btn { background-color: #dc3545; color: #fff; }
        /* CropperJS CSS Fix */
        .cropper-container { max-width: 100%; }
        .follow-profile-btn { width: auto; padding: 8px 20px; margin-top: 10px; background: #0d6efd; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; transition: background 0.2s; }
        .follow-profile-btn.following { background: #555; border: 1px solid #777; }
        .verified-badge { color: #1da1f2; margin-left: 5px; font-size: 1rem; vertical-align: middle; }
        @media (max-width: 480px) {
            .container { width: 90%; padding: 20px; }
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>

<div class="container">
    <h2>My Profile</h2>
    <img id="preview" src="https://via.placeholder.com/100" class="profile-pic" onclick="document.getElementById('file-input').click()" title="Click to change photo">
    <input type="file" id="file-input" style="display: none;" accept="image/*">
    <button id="follow-btn" class="follow-profile-btn" style="display: none;">Follow</button>
    <p id="photo-hint" style="font-size: 0.8rem; opacity: 0.8;">Tap image to change</p>
    
    <!-- Followers/Following Stats -->
    <div style="display: flex; gap: 30px; margin: 15px 0; justify-content: center; width: 100%;">
        <div onclick="window.showUserList('followers')" style="cursor: pointer; text-align: center;">
            <span id="followers-count" style="font-size: 1.4rem; font-weight: bold; color: gold;">0</span><br>
            <span style="font-size: 0.85rem; color: #aaa;">Followers</span>
        </div>
        <div onclick="window.showUserList('following')" style="cursor: pointer; text-align: center;">
            <span id="following-count" style="font-size: 1.4rem; font-weight: bold; color: gold;">0</span><br>
            <span style="font-size: 0.85rem; color: #aaa;">Following</span>
        </div>
    </div>

    <div id="verified-indicator" style="display:none; color:#1da1f2; font-weight:bold; margin: 5px 0;">✔ Verified Account</div>
    <input type="text" id="username" placeholder="Unique ID (e.g. @cricket_lover)" style="background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">
    <input type="text" id="name" placeholder="Display Name">
    <textarea id="bio" rows="3" placeholder="Bio (e.g. Cricket Lover from Mumbai)"></textarea>
    
    <button id="save-btn">Save Profile</button>
    <button id="change-pwd-btn" style="background-color: #198754; margin-top: 10px; width: 100%; padding: 10px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Change Password</button>
    <button class="back-btn" onclick="window.location.href='news.html'">Back to News</button>
    <button id="delete-acc-btn" style="background-color: #dc3545; margin-top: 30px; width: 100%; padding: 10px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Delete Account</button>

    <div id="my-blogs-section" style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; text-align: left;">
        <h3 style="color: gold; margin-bottom: 15px; text-align: center;">My Blogs</h3>
        <div id="my-blogs-list">Loading...</div>
    </div>

    <!-- Cropper Modal -->
    <div id="cropper-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; flex-direction:column; align-items:center; justify-content:center;">
        <div style="width:90%; max-width:500px; max-height:70vh; background:#000; overflow:hidden; border-radius:8px;">
            <img id="cropper-image" style="max-width:100%; display:block;">
        </div>
        <div style="margin-top:20px; display:flex; gap:15px;">
            <button id="btn-crop" style="background:#28a745; color:white; padding:10px 25px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Crop & Save</button>
            <button id="btn-cancel-crop" style="background:#dc3545; color:white; padding:10px 25px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <!-- User List Modal (Followers/Following) -->
    <div id="user-list-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; flex-direction:column; align-items:center; justify-content:center;">
        <div style="width:90%; max-width:400px; background:#1e1e1e; border: 1px solid #444; border-radius:12px; padding:20px; max-height:70vh; display:flex; flex-direction:column;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                <h3 id="user-list-title" style="margin:0; color:gold;">Users</h3>
                <button onclick="document.getElementById('user-list-modal').style.display='none'" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div id="user-list-content" style="overflow-y:auto; flex:1;">Loading...</div>
        </div>
    </div>

    <!-- Password Modal (For Change Password & Delete Account) -->
    <div id="password-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:3000; align-items:center; justify-content:center;">
        <div style="background:#1e1e1e; padding:25px; border-radius:10px; width:90%; max-width:400px; border: 1px solid #444; text-align: center; color: white;">
            <h3 id="pwd-modal-title" style="color:gold; margin-top:0; margin-bottom: 15px;">Title</h3>
            <p id="pwd-modal-desc" style="color:#ccc; font-size:0.9rem; margin-bottom: 20px;">Description</p>
            
            <div id="pwd-auth-section">
                <input type="password" id="current-password" placeholder="Current Password" style="width:100%; padding:10px; margin-bottom:15px; background:#333; border:1px solid #555; color:white; border-radius:5px;">
            </div>
            
            <div id="new-password-section" style="display:none;">
                <input type="password" id="new-password" placeholder="New Password (min 6 chars)" style="width:100%; padding:10px; margin-bottom:10px; background:#333; border:1px solid #555; color:white; border-radius:5px;">
                <input type="password" id="confirm-password" placeholder="Confirm New Password" style="width:100%; padding:10px; margin-bottom:15px; background:#333; border:1px solid #555; color:white; border-radius:5px;">
            </div>

            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="pwd-action-btn" style="flex:1; padding:10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Confirm</button>
                <button onclick="document.getElementById('password-modal').style.display='none'" style="flex:1; background:#555; color:white; padding:10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, deleteDoc, updateDoc, arrayUnion, arrayRemove, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, updateProfile, deleteUser, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;
    let currentProfileData = {}; // Store loaded profile data for lists

    // Handle Image Selection
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    let base64Image = null;

    // Cropper variables
    let cropper;
    const cropperModal = document.getElementById('cropper-modal');
    const cropperImage = document.getElementById('cropper-image');
    const btnCrop = document.getElementById('btn-crop');
    const btnCancelCrop = document.getElementById('btn-cancel-crop');

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                cropperImage.src = e.target.result;
                cropperModal.style.display = 'flex';
                if(cropper) cropper.destroy();
                cropper = new Cropper(cropperImage, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false,
                });
            };
            reader.readAsDataURL(file);
        }
        fileInput.value = ''; // Allow re-selecting same file
    });

    btnCancelCrop.addEventListener('click', () => {
        cropperModal.style.display = 'none';
        if(cropper) cropper.destroy();
    });

    btnCrop.addEventListener('click', () => {
        if(!cropper) return;
        
        // Get cropped canvas (limit size to 600x600 for profile pic)
        const canvas = cropper.getCroppedCanvas({
            width: 600,
            height: 600,
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high',
        });

        // Compress to under 1MB
        let quality = 0.9;
        let dataURL = canvas.toDataURL('image/jpeg', quality);
        
        // 1MB approx 1.33 million base64 chars
        while (dataURL.length > 1330000 && quality > 0.1) {
            quality -= 0.1;
            dataURL = canvas.toDataURL('image/jpeg', quality);
        }

        preview.src = dataURL;
        base64Image = dataURL;
        
        cropperModal.style.display = 'none';
        cropper.destroy();
    });

    onAuthStateChanged(auth, async (user) => {
        const urlParams = new URLSearchParams(window.location.search);
        const viewUid = urlParams.get('uid');

        if (user) {
            currentUser = user;
        }

        if (viewUid && (!user || viewUid !== user.uid)) {
            // View Mode (Guest or viewing someone else)
            document.querySelector('h2').innerText = "User Profile";
            document.getElementById('save-btn').style.display = 'none';
            document.getElementById('change-pwd-btn').style.display = 'none';
            document.getElementById('delete-acc-btn').style.display = 'none';
            document.getElementById('photo-hint').style.display = 'none';
            document.getElementById('preview').onclick = null;
            document.getElementById('preview').style.cursor = 'default';
            document.getElementById('preview').style.border = '3px solid #87ceeb';
            
            ['username', 'name', 'bio'].forEach(id => {
                const el = document.getElementById(id);
                el.readOnly = true;
                el.style.border = 'none';
                el.style.background = 'transparent';
                el.style.textAlign = 'center';
            });

            loadProfileData(viewUid);
            fetchMyBlogs(viewUid, false); // false = not owner
            
            // Setup Follow Button
            if (user) {
                const followBtn = document.getElementById('follow-btn');
                followBtn.style.display = 'inline-block';
                
                // Check if already following
                try {
                    const myDoc = await getDoc(doc(db, "users", user.uid));
                    const myData = myDoc.data();
                    const isFollowing = myData.following && myData.following.includes(viewUid);
                    updateFollowButton(isFollowing);
                    
                    followBtn.onclick = () => toggleFollow(viewUid, isFollowing);
                } catch(e) { console.error(e); }
            }
        } else if (user) {
            // Edit Mode (My Profile)
            // Load existing profile
                loadProfileData(user.uid);
                fetchMyBlogs(user.uid, true); // true = owner

                // Check if username is required
                if (urlParams.get('requireUsername') === 'true' && !document.getElementById('username').value) {
                    alert("Please create a Unique ID (Username) to continue.");
                    document.getElementById('username').focus();
                    document.querySelector('.back-btn').style.display = 'none'; // Hide back button to enforce creation
                }
        } else {
            window.location.href = 'news.html';
        }
    });

    function updateFollowButton(isFollowing) {
        const btn = document.getElementById('follow-btn');
        if (isFollowing) {
            btn.innerText = "Following";
            btn.classList.add('following');
        } else {
            btn.innerText = "Follow";
            btn.classList.remove('following');
        }
    }

    async function toggleFollow(targetUid, isCurrentlyFollowing) {
        const myUid = currentUser.uid;
        const userRef = doc(db, "users", myUid);
        const targetRef = doc(db, "users", targetUid);
        
        try {
            if (isCurrentlyFollowing) {
                await updateDoc(userRef, { following: arrayRemove(targetUid) });
                await updateDoc(targetRef, { followers: arrayRemove(myUid) });
                updateFollowButton(false);
                // Update click handler state
                document.getElementById('follow-btn').onclick = () => toggleFollow(targetUid, false);
            } else {
                await updateDoc(userRef, { following: arrayUnion(targetUid) });
                await updateDoc(targetRef, { followers: arrayUnion(myUid) });
                
                // Send Notification
                await addDoc(collection(db, "notifications"), {
                    recipientUid: targetUid,
                    senderUid: myUid,
                    senderName: currentUser.displayName || "Someone",
                    type: "follow",
                    date: new Date().toISOString(),
                    read: false
                });

                updateFollowButton(true);
                document.getElementById('follow-btn').onclick = () => toggleFollow(targetUid, true);
            }
            // Refresh counts
            loadProfileData(targetUid);
        } catch(e) { console.error("Follow error:", e); alert("Error updating follow status"); }
    }

    async function loadProfileData(uid) {
        try {
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                currentProfileData = data; // Store for list access
                document.getElementById('name').value = data.name || "";
                document.getElementById('username').value = data.username || "";
                document.getElementById('bio').value = data.bio || "";
                if (data.photoURL) {
                    document.getElementById('preview').src = data.photoURL;
                    if (currentUser && uid === currentUser.uid) base64Image = data.photoURL;
                }
                
                // Update Counts
                const followers = data.followers || [];
                const following = data.following || [];
                document.getElementById('followers-count').innerText = followers.length;
                document.getElementById('following-count').innerText = following.length;

                // Verified Badge
                if (data.isVerified) {
                    document.getElementById('verified-indicator').style.display = 'block';
                } else {
                    document.getElementById('verified-indicator').style.display = 'none';
                }
            } else if (currentUser && uid === currentUser.uid) {
                document.getElementById('name').value = currentUser.displayName;
                if (currentUser.photoURL) document.getElementById('preview').src = currentUser.photoURL;
            }
        } catch (e) { console.error("Error loading profile:", e); }
    }

    async function fetchMyBlogs(uid, isOwner) {
        const list = document.getElementById('my-blogs-list');
        list.innerHTML = '<p style="text-align:center; color:#aaa;">Loading...</p>';
        try {
            const q = query(collection(db, "blogs"), where("authorUid", "==", uid));
            const querySnapshot = await getDocs(q);
            
            list.innerHTML = '';
            if (querySnapshot.empty) {
                list.innerHTML = '<p style="text-align:center; color:#aaa;">No blogs yet.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const blog = doc.data();
                
                // Filter drafts if not owner
                if (!isOwner && blog.status === 'draft') return;

                const draftBadge = (blog.status === 'draft') ? '<span style="background:orange; color:black; padding:2px 5px; border-radius:4px; font-size:0.7rem; margin-left:5px;">DRAFT</span>' : '';

                const div = document.createElement('div');
                div.className = 'blog-card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <h4 style="margin:0; color:#fff; font-size: 1rem;">${blog.title} ${draftBadge}</h4>
                        <span style="font-size:0.7rem; color:#aaa;">${new Date(blog.date).toLocaleDateString()}</span>
                    </div>
                    <p style="color:#ddd; font-size:0.85rem; margin: 5px 0 10px 0;">${blog.content.substring(0, 50)}...</p>
                    ${isOwner ? `<div>
                        <button onclick="window.editMyBlog('${doc.id}')" class="action-btn edit-btn">Edit</button>
                        <button onclick="window.deleteMyBlog('${doc.id}')" class="action-btn delete-btn">Delete</button>
                    </div>` : ''}
                `;
                list.appendChild(div);
            });
        } catch (e) {
            console.error("Error fetching blogs:", e);
            list.innerHTML = '<p style="color:red;">Error loading blogs.</p>';
        }
    }

    // Global functions for buttons
    window.editMyBlog = (id) => {
        window.location.href = `write-blog.html?id=${id}`;
    };

    window.deleteMyBlog = async (id) => {
        if(confirm("Are you sure you want to delete this blog?")) {
            try {
                await deleteDoc(doc(db, "blogs", id));
                if(currentUser) fetchMyBlogs(currentUser.uid);
            } catch(e) { alert("Error: " + e.message); }
        }
    };

    // Function to show Followers/Following list
    window.showUserList = async (type) => {
        const modal = document.getElementById('user-list-modal');
        const title = document.getElementById('user-list-title');
        const content = document.getElementById('user-list-content');
        
        modal.style.display = 'flex';
        title.innerText = type === 'followers' ? 'Followers' : 'Following';
        content.innerHTML = '<p style="text-align:center; color:#aaa;">Loading...</p>';
        
        const uids = (type === 'followers' ? currentProfileData.followers : currentProfileData.following) || [];
        
        if (uids.length === 0) {
            content.innerHTML = '<p style="text-align:center; color:#aaa;">No users found.</p>';
            return;
        }

        try {
            content.innerHTML = '';
            // Fetch details for each user
            const promises = uids.map(uid => getDoc(doc(db, "users", uid)));
            const snapshots = await Promise.all(promises);
            
            snapshots.forEach(snap => {
                if (snap.exists()) {
                    const u = snap.data();
                    const div = document.createElement('div');
                    div.style.cssText = "display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); cursor:pointer;";
                    div.onclick = () => window.location.href = `profile.html?uid=${snap.id}`;
                    
                    div.innerHTML = `
                        <img src="${u.photoURL || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:1px solid #555;">
                        <div>
                            <div style="font-weight:bold; color:#fff;">${u.name || 'User'}</div>
                            <div style="font-size:0.8rem; color:#aaa;">${u.username || ''}</div>
                        </div>
                    `;
                    content.appendChild(div);
                }
            });
        } catch (e) { console.error(e); content.innerHTML = '<p style="color:red;">Error loading list.</p>'; }
    };

    document.getElementById('save-btn').addEventListener('click', async () => {
        if (!currentUser) return;
        
        const name = document.getElementById('name').value;
        const username = document.getElementById('username').value.trim();
        const bio = document.getElementById('bio').value;
        const photoURL = base64Image || currentUser.photoURL;
        
        // Verification Criteria: Auto-verify if followers >= 50
        let isVerified = currentProfileData.isVerified || false;
        const followersCount = (currentProfileData.followers || []).length;
        if (followersCount >= 50) {
            isVerified = true;
        }

        try {
            // 1. Update Firebase Auth Profile (for basic display)
            // Note: We don't update photoURL here because Firebase Auth has a small limit.
            // The large base64 image is stored in Firestore below.
            await updateProfile(currentUser, {
                displayName: name
            });

            // Check Username Uniqueness
            if (username) {
                const q = query(collection(db, "users"), where("username", "==", username));
                const snap = await getDocs(q);
                let isTaken = false;
                snap.forEach(d => { if (d.id !== currentUser.uid) isTaken = true; });
                
                if (isTaken) {
                    alert("Username '" + username + "' is already taken. Please choose another.");
                    return;
                }
            } else {
                alert("Unique ID (Username) is required!");
                return;
            }

            // 2. Save detailed profile to Firestore
            await setDoc(doc(db, "users", currentUser.uid), {
                name: name,
                username: username,
                bio: bio,
                photoURL: photoURL,
                email: currentUser.email,
                isVerified: isVerified
            }, { merge: true });

            // Update author details in all existing blogs AND comments
            const allBlogsSnapshot = await getDocs(collection(db, "blogs"));
            
            const updatePromises = [];
            
            allBlogsSnapshot.forEach((blogDoc) => {
                const blogData = blogDoc.data();
                const updates = {};
                let needsUpdate = false;

                // 1. Update Blog Author info if this user is the author
                if (blogData.authorUid === currentUser.uid) {
                    updates.author = name;
                    updates.authorPhoto = photoURL;
                    updates.authorVerified = isVerified;
                    needsUpdate = true;
                }

                // 2. Update Comments info if this user commented
                if (blogData.comments && Array.isArray(blogData.comments)) {
                    let commentsChanged = false;
                    const updatedComments = blogData.comments.map(comment => {
                        let c = { ...comment };
                        let cChanged = false;

                        if (c.userUid === currentUser.uid) {
                            c.author = name;
                            c.photo = photoURL;
                            c.userVerified = isVerified;
                            cChanged = true;
                        }

                        if (c.replies && Array.isArray(c.replies)) {
                            const newReplies = c.replies.map(reply => {
                                if (reply.userUid === currentUser.uid) {
                                    cChanged = true;
                                    return { ...reply, author: name, photo: photoURL, userVerified: isVerified };
                                }
                                return reply;
                            });
                            if (cChanged) c.replies = newReplies;
                        }

                        if (cChanged) commentsChanged = true;
                        return c;
                    });

                    if (commentsChanged) {
                        updates.comments = updatedComments;
                        needsUpdate = true;
                    }
                }

                if (needsUpdate) {
                    updatePromises.push(updateDoc(doc(db, "blogs", blogDoc.id), updates));
                }
            });
            await Promise.all(updatePromises);

            alert("Profile Saved Successfully!");
            
            // If came from forced redirect, go back to news
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('requireUsername') === 'true') {
                window.location.href = 'news.html';
            }
        } catch (error) {
            console.error("Error saving profile:", error);
            alert("Error saving profile: " + error.message);
        }
    });

    // Password Modal Logic
    const pwdModal = document.getElementById('password-modal');
    const pwdActionBtn = document.getElementById('pwd-action-btn');
    let currentAction = null; // 'change_pwd' or 'delete_acc'

    document.getElementById('change-pwd-btn').addEventListener('click', () => {
        // Check if user is using password provider
        const isPasswordUser = currentUser.providerData.some(p => p.providerId === 'password');
        if (!isPasswordUser) {
            alert("You are logged in with a social account (e.g., Google). Please manage your password through that provider.");
            return;
        }

        currentAction = 'change_pwd';
        document.getElementById('pwd-modal-title').innerText = "Change Password";
        document.getElementById('pwd-modal-desc').innerText = "Please enter your current password to verify identity, then enter your new password.";
        document.getElementById('new-password-section').style.display = 'block';
        pwdActionBtn.innerText = "Update Password";
        pwdActionBtn.style.backgroundColor = "#198754";
        pwdActionBtn.style.color = "white";
        
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
        pwdModal.style.display = 'flex';
    });

    document.getElementById('delete-acc-btn').addEventListener('click', async () => {
        currentAction = 'delete_acc';
        document.getElementById('pwd-modal-title').innerText = "Delete Account";
        document.getElementById('pwd-modal-desc').innerText = "WARNING: This action is irreversible. Enter your password to confirm deletion.";
        document.getElementById('new-password-section').style.display = 'none';
        pwdActionBtn.innerText = "Delete Forever";
        pwdActionBtn.style.backgroundColor = "#dc3545";
        pwdActionBtn.style.color = "white";
        
        document.getElementById('current-password').value = '';
        pwdModal.style.display = 'flex';
    });

    pwdActionBtn.addEventListener('click', async () => {
        if (!currentUser) return;
        const currentPwd = document.getElementById('current-password').value;
        if (!currentPwd) { alert("Please enter your current password."); return; }

        const credential = EmailAuthProvider.credential(currentUser.email, currentPwd);
        
        try {
            // 1. Re-authenticate
            await reauthenticateWithCredential(currentUser, credential);

            if (currentAction === 'delete_acc') {
                await deleteDoc(doc(db, "users", currentUser.uid));
                await deleteUser(currentUser);
                alert("Account deleted successfully.");
                window.location.href = 'news.html';
            } else if (currentAction === 'change_pwd') {
                const newPwd = document.getElementById('new-password').value;
                const confirmPwd = document.getElementById('confirm-password').value;
                
                if (newPwd !== confirmPwd) { alert("New passwords do not match."); return; }
                if (newPwd.length < 6) { alert("Password must be at least 6 characters."); return; }
                
                await updatePassword(currentUser, newPwd);
                alert("Password updated successfully!");
                pwdModal.style.display = 'none';
            }
        } catch (error) {
            console.error("Action error:", error);
            alert("Error: " + error.message);
        }
    });
</script>

</body>
</html>
