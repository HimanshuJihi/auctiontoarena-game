<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Blog - Cricket News</title>
    <link rel="icon" href="game-logo.png" type="image/png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff69b4, #62b7d8, #e22bb7);
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        h1 { text-align: center; color: #fff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea { height: 200px; resize: vertical; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background-color: #0d6efd;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #0b5ed7; }
        .btn-cancel { background-color: #6c757d; margin-left: 10px; }
        .btn-cancel:hover { background-color: #5c636a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>अपना क्रिकेट ब्लॉग लिखें</h1>
        <form id="blogForm">
            <div class="form-group">
                <label for="title">शीर्षक (Title)</label>
                <input type="text" id="title" required placeholder="Ex: भारत की शानदार जीत...">
            </div>
            <div class="form-group">
                <label for="author">लेखक (Author Name)</label>
                <input type="text" id="author" required placeholder="आपका नाम">
            </div>
            <div class="form-group">
                <label for="content">सामग्री (Content)</label>
                <textarea id="content" required placeholder="यहाँ अपने विचार लिखें..."></textarea>
            </div>
            <button type="submit" class="btn">Publish Blog</button>
            <a href="news.html" class="btn btn-cancel">Cancel</a>
        </form>
    </div>

    <script>
        // Check if we are editing an existing blog
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');
        
        if (editId) {
            const blogs = JSON.parse(localStorage.getItem('cricket_user_blogs') || '[]');
            const blog = blogs.find(b => b.id == editId);
            if (blog) {
                document.querySelector('h1').innerText = "Edit Blog";
                document.getElementById('title').value = blog.title;
                document.getElementById('author').value = blog.author;
                document.getElementById('content').value = blog.content;
                document.querySelector('.btn').innerText = "Update Blog";
            }
        }

        document.getElementById('blogForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;
            
            if(title && author && content) {
                let blogs = JSON.parse(localStorage.getItem('cricket_user_blogs') || '[]');
                
                if (editId) {
                    // Update existing blog
                    const index = blogs.findIndex(b => b.id == editId);
                    if (index !== -1) {
                        blogs[index].title = title;
                        blogs[index].author = author;
                        blogs[index].content = content;
                    }
                } else {
                    // Create new blog
                    const blog = {
                        id: Date.now(),
                        title: title,
                        author: author,
                        content: content,
                        date: new Date().toISOString(),
                        image: 'game-logo.png', // Default image
                        comments: []
                    };
                    blogs.push(blog);
                }
                
                // Save back to local storage
                localStorage.setItem('cricket_user_blogs', JSON.stringify(blogs));
                
                alert(editId ? 'Blog Updated Successfully!' : 'Blog Published Successfully!');
                window.location.href = 'news.html';
            }
        });
    </script>
</body>
</html>
